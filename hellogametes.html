<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Catch Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        canvas {
            background: #333;
            display: block;
            margin: 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Catch the Gold! 🪙</h1>
    <p>Use your <b>Left</b> and <b>Right</b> arrow keys to catch the falling coins.</p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game variables
        let score = 0;
        let basket = { x: 160, y: 450, width: 80, height: 20, speed: 8 };
        let coin = { x: Math.random() * 370, y: 0, radius: 15, speed: 4 };
        
        let keys = {};

        // Listen for keyboard inputs
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function update() {
            // Move basket
            if (keys["ArrowLeft"] && basket.x > 0) {
                basket.x -= basket.speed;
            }
            if (keys["ArrowRight"] && basket.x < canvas.width - basket.width) {
                basket.x += basket.speed;
            }

            // Move coin down
            coin.y += coin.speed;

            // Check if coin hits the floor (Missed!)
            if (coin.y > canvas.height) {
                resetCoin();
                score = Math.max(0, score - 1); // Penalty for missing
            }

            // Check if basket catches the coin (Collision detection)
            if (
                coin.y + coin.radius >= basket.y &&
                coin.x >= basket.x &&
                coin.x <= basket.x + basket.width
            ) {
                score += 1;
                coin.speed += 0.2; // Gets slightly faster every time you catch it!
                resetCoin();
            }
        }

        function resetCoin() {
            coin.y = 0;
            coin.x = Math.random() * (canvas.width - 30) + 15;
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Basket
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

            // Draw Coin
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.closePath();

            // Draw Score
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 20, 30);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
