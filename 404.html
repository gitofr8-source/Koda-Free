<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting — Koda</title>
<style>
  html, body { background: #000000; color: #f5f5f5; font-family: system-ui, -apple-system, sans-serif; margin: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 32px; border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; background: #0a0a0a; max-width: 380px; }
  a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #ffffff; color: #000000; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 13px; }
</style>
<script>
  (function () {
    var routes = {
      'chat': 'chat.html',
      'workspace': 'chat.html',
      'login': 'login.html',
      'signin': 'login.html',
      'auth': 'login.html',
      'profile': 'profile.html',
      'account': 'profile.html',
      'accounts': 'profile.html'
    };
    var pathname = window.location.pathname || '/';
    var trimmed = pathname.replace(/\/+$/, '');
    var parts = trimmed.split('/').filter(Boolean);
    var last = parts.length ? parts[parts.length - 1].toLowerCase() : '';
    if (routes[last]) {
      var base = parts.slice(0, parts.length - 1).join('/');
      var prefix = base ? '/' + base + '/' : '/';
      window.location.replace(prefix + routes[last] + window.location.search + window.location.hash);
    }
  })();
</script>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 8px;font-size:20px;">Page not found</h2>
    <p style="margin:0;color:#888;font-size:13px;">The requested Koda route could not be located.</p>
    <a href="./index.html">Return to Koda Home</a>
  </div>
</body>
</html>
