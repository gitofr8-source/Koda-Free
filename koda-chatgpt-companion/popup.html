<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      font-size: 11px;
      color: #4ade80;
      font-family: monospace;
      margin-top: 12px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }
    p {
      color: #8e94a0;
      font-size: 12px;
      line-height: 1.4;
      margin: 12px 0 0 0;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px 12px;
      background: #fff;
      color: #000;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>Koda AI &times; ChatGPT</span>
  </div>
  <div class="badge">
    <span class="dot"></span>
    <span id="statusText">Mirror Active</span>
  </div>
  <p>Connected to your local Koda server. Prompts sent in Koda mirror directly into your ChatGPT account.</p>
  <a href="http://localhost:3000" target="_blank" class="btn">Open Koda Workspace</a>
</body>
</html>
